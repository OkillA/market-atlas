-size:13px;font-weight:400;fill:#586057;">3</text><text class="af-text" x="546.7142857142858" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">6</text><text class="af-text" x="735" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">8</text><text class="af-text" x="405.5" y="347" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Ordered observation</text><path data-series="0" d="M76.00,232.23 L170.14,252.47 L264.29,272.71 L358.43,232.23 L452.57,151.26 L546.71,90.53 L640.86,70.29 L735.00,131.02 " fill="none" stroke="#234d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="170.14285714285714" y1="252.46774193548384" x2="216.14285714285714" y2="276.46774193548384" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="99" cx="170.14285714285714" cy="252.46774193548384" r="3.5" fill="#fffefa" stroke="#234d3d" stroke-width="1.7"><title>First assumed exit: $99 stop</title></circle><rect x="176.14285714285714" y="265.46774193548384" width="80" height="21" fill="#fffefa" opacity=".92"/><text class="af-text" x="180.14285714285714" y="279.46774193548384" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Stop first</text><line x1="640.8571428571428" y1="70.29032258064518" x2="666.4571428571428" y2="57" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="108" cx="640.8571428571428" cy="70.29032258064518" r="3.5" fill="#fffefa" stroke="#234d3d" stroke-width="1.7"><title>Later high $108, after exit</title></circle><rect x="646.8571428571428" y="46" width="39.2" height="21" fill="#fffefa" opacity=".92"/><text class="af-text" x="650.8571428571428" y="60" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">H108</text><line x1="76" x2="102" y1="369" y2="369" stroke="#234d3d" stroke-width="2.4" /><text class="af-text" x="111" y="373" text-anchor="start" style="font-size