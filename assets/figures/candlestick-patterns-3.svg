<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 634" role="img" aria-label="Do not collapse geometry, confirmation and outcome"><title>Do not collapse geometry, confirmation and outcome</title><desc>Alternative fictional continuations share the same hammer-like candle. Read each branch from its own starting point; branch B does not follow branch A.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="634" fill="#fffefa"/><text class="af-text" x="10" y="27" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Branch A: confirmation followed by decline</text><g transform="translate(0 50)"><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Geometry known</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">O50/H51/L47/C50.80 meets the fixed tail rule.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Branch A: next close $51.20</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Above 51: the separate follow-up condition occurs.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Branch A later: open $46.50, close $45</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">An adverse continuation follows confirmation.</text></g><text class="af-text" x="10" y="388" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Branch B: no confirmation</text><g transform="translate(0 411)"><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Geometry known</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">O50/H51/L47/C50.80 meets the fixed tail rule.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Branch B: next open $46.50, close $45</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">The supplied next-close confirmation never occurs.</text></g></svg>
