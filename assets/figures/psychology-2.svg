<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 377" role="img" aria-label="The note stays frozen as facts arrive"><title>The note stays frozen as facts arrive</title><desc>Fictional BRDG-P1 record. The outcome and the temptation to rewrite it are appended beside the original note, not substituted for it.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="377" fill="#fffefa"/><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Cutoff</text><text class="af-text" x="257.33333333333337" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">New information</text><text class="af-text" x="502.6666666666667" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Process / interpretation record</text><line x1="12" y1="47" x2="748" y2="47" stroke="#e2e6dd"/><text class="af-text" x="12" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">S1 09:31</text><text class="af-text" x="257.33333333333337" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">50 simulated shares filled at</text><text class="af-text" x="257.33333333333337" y="84" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">$50.60</text><text class="af-text" x="502.6666666666667" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">P1 gate passed; 1R freezes $100;</text><text class="af-text" x="502.6666666666667" y="84" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">cost $2.50.</text><line x1="12" y1="105" x2="748" y2="105" stroke="#e2e6dd"/><text class="af-text" x="12" y="123" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">S2 close</text><text class="af-text" x="257.33333333333337" y="123" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Close $49.60 is below $50</text><text class="af-text" x="502.6666666666667" y="123" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Continuation weakened as</text><text class="af-text" x="502.6666666666667" y="142" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">anticipated; no stop yet. No</text><text class="af-text" x="502.6666666666667" y="161" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">retroactive close-exit rule.</text><line x1="12" y1="182" x2="748" y2="182" stroke="#e2e6dd"/><text class="af-text" x="12" y="200" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">S3 stop model</text><text class="af-text" x="257.33333333333337" y="200" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Exit $48.60; gross −$100, costs</text><text class="af-text" x="257.33333333333337" y="219" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">$5, net −$105</text><text class="af-text" x="502.6666666666667" y="200" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">P1 complied; net −1.05R.</text><text class="af-text" x="502.6666666666667" y="219" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Hypothesis failed on this path; no</text><text class="af-text" x="502.6666666666667" y="238" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">general strategy conclusion.</text><line x1="12" y1="259" x2="748" y2="259" stroke="#e2e6dd"/><text class="af-text" x="12" y="277" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Review after S3</text><text class="af-text" x="257.33333333333337" y="277" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Temptation: “The upper shadow made</text><text class="af-text" x="257.33333333333337" y="296" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">failure obvious.”</text><text class="af-text" x="502.6666666666667" y="277" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Original note allowed failure but</text><text class="af-text" x="502.6666666666667" y="296" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">predicted no probability. Keep the</text><text class="af-text" x="502.6666666666667" y="315" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">note; propose P2 close-exit</text><text class="af-text" x="502.6666666666667" y="334" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">research without changing P1.</text></svg>
