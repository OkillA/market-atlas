<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 498" role="img" aria-label="A candidate becomes available in stages"><title>A candidate becomes available in stages</title><desc>These are information states at completed-session cutoffs, not backdated entry signals.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="498" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. D4: candidate high 46</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Two earlier closes are lower; future comparisons unknown.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. D5: one later close</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">45 is lower, but one required comparison remains.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. D6: high 46 confirmed</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">43 is the second lower close. A low 43 is only a candidate.</text><text class="af-text" x="20" y="293" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="325" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. D8: low 43 confirmed</text><text class="af-text" x="15" y="354" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">46 and 49 supply its two higher following closes.</text><text class="af-text" x="20" y="393" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="425" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">5. D10 then D12</text><text class="af-text" x="15" y="454" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">The line is crossed on D10; the higher low 45 is confirmed on D12.</text></svg>
