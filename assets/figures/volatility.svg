<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="What the overnight gap adds to true range"><title>What the overnight gap adds to true range</title><desc>Fictional previous O = 99/H = 101/L = 99/C = 100; current O = 104/H = 107/L = 104/C = 106. Current range is $3, opening gap $4, and previous close to high $7, which determines true range. Values match the table, example, and exercise.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="400" fill="#fffefa"/><text class="af-text" x="70" y="18" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Price ($)</text><line x1="70" y1="274" x2="734" y2="274" stroke="#e2e6dd"/><text class="af-text" x="62" y="278" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">97.8</text><line x1="70" y1="215.24999999999983" x2="734" y2="215.24999999999983" stroke="#e2e6dd"/><text class="af-text" x="62" y="219.24999999999983" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">100.4</text><line x1="70" y1="156.5" x2="734" y2="156.5" stroke="#e2e6dd"/><text class="af-text" x="62" y="160.5" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">103.0</text><line x1="70" y1="97.75000000000017" x2="734" y2="97.75000000000017" stroke="#e2e6dd"/><text class="af-text" x="62" y="101.75000000000017" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">105.6</text><line x1="70" y1="39" x2="734" y2="39" stroke="#e2e6dd"/><text class="af-text" x="62" y="43" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">108.2</text><line x1="236" y1="201.69230769230768" x2="236" y2="246.88461538461533" stroke="#234d3d" stroke-width="1.8"/><rect x="218" y="224.2884615384615" width="36" height="22.59615384615384" fill="#234d3d"/><title>Previous: O 99, H 101, L 99, C 100</title><text class="af-text" x="236" y="298" text-anchor="middle" style="font-size:12px;font-weight:400;f