<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" role="img" aria-label="Keep the two information cutoffs"><title>Keep the two information cutoffs</title><desc>A fictional sequence. Neither the candle nor a trigger level establishes a live execution.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="298" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Before release</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Known close $52; modeled entry 100 × $52, trigger $48. Future gap unknown.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Next open</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">New observation $43. Assumed exit model gives $900 price loss, not $400.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Next close</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">O = 43/H = 47/L = 42/C = 46. +6.98% intraday and −11.54% close-to-close.</text></svg>
