<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="The signal close and the ineligible next open"><title>The signal close and the ineligible next open</title><desc>Same main Harbor example. Session 9 closes at $50.80; session 10 opens at $52.20, so the opening-only plan skips before the closing failure is known. OHLC values are fictional and do not supply transaction sequence.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="400" fill="#fffefa"/><text class="af-text" x="70" y="18" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Price ($)</text><line x1="70" y1="274" x2="734" y2="274" stroke="#e2e6dd"/><text class="af-text" x="62" y="278" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">48.6</text><line x1="70" y1="215.24999999999983" x2="734" y2="215.24999999999983" stroke="#e2e6dd"/><text class="af-text" x="62" y="219.24999999999983" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">49.7</text><line x1="70" y1="156.5" x2="734" y2="156.5" stroke="#e2e6dd"/><text class="af-text" x="62" y="160.5" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">50.9</text><line x1="70" y1="97.75000000000017" x2="734" y2="97.75000000000017" stroke="#e2e6dd"/><text class="af-text" x="62" y="101.75000000000017" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">52.0</text><line x1="70" y1="39" x2="734" y2="39" stroke="#e2e6dd"/><text class="af-text" x="62" y="43" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">53.1</text><line x1="236" y1="148.75274725274733" x2="236" y2="241.7197802197802" stroke="#234d3d" stroke-width="1.8"/><rect x="218" y="159.0824175824178" width="36" height="72.30769230769226" fill="#234d3d"/><title>9: signal: O 49.4, H 51, L 49.2, C 50.8</title><text class="af-text" x="236" y="298" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">9: signal</text><text class="af-text" x="236" y="340" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">O 49.4  H 51</text><text class="af-text" x="236" y="359" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">L 49.2  C 50.8</text><line x1="568" y1="66.11538461538458" x2="568" y2="246.88461538461544" stroke="#a6523e" stroke-width="1.8"/><rect x="550" y="86.77472527472517" width="36" height="144.6153846153849" fill="#a6523e"/><title>10: skip: O 52.2, H 52.6, L 49.1, C 49.4</title><text class="af-text" x="568" y="298" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">10: skip</text><text class="af-text" x="568" y="340" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">O 52.2  H 52.6</text><text class="af-text" x="568" y="359" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">L 49.1  C 49.4</text><text class="af-text" x="402" y="392" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Regular session</text></svg>
