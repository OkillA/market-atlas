le><text class="af-text" x="236" y="298" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">9: signal</text><text class="af-text" x="236" y="340" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">O 49.4  H 51</text><text class="af-text" x="236" y="359" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">L 49.2  C 50.8</text><line x1="568" y1="66.11538461538458" x2="568" y2="246.88461538461544" stroke="#a6523e" stroke-width="1.8"/><rect x="550" y="86.77472527472517" width="36" height="144.6153846153849" fill="#a6523e"/><title>10: skip: O 52.2, H 52.6, L 49.1, C 49.4</title><text class="af-text" x="568" y="298" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">10: skip</text><text class="af-text" x="568" y="340" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">O 52.2  H 52.6</text><text class="af-text" x="568" y="359" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">L 49.1  C 49.4</text><line x1="73" y1="159.0824175824178" x2="734" y2="159.0824175824178" stroke="#263831" stroke-width="1.1" stroke-dasharray="6 4" opacity=".75"><title>Entry ceiling $50.80</title></line><rect x="602.64" y="140.0824175824178" width="131.36" height="16" fill="#fffefa" opacity=".92"/><text class="af-text" x="606.64" y="152.0824175824178" text-anchor="start" style="font-size:12px;font-weight:500;fill:#263831;">Entry ceiling $50.80</text><text class="af-text" x="402" y="392" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Regular session</text></svg>
