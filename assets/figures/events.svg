<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A positive intraday candle after a negative opening gap"><title>A positive intraday candle after a negative opening gap</title><desc>Same fictional event case as table, example, and exercise. Previous O = 51/H = 53/L = 50/C = 52. Announcement follows the prior close. Next O = 43/H = 47/L = 42/C = 46. The $3 intraday rise is distinct from the $9 opening gap and $6 close-to-close loss.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="400" fill="#fffefa"/><text class="af-text" x="70" y="18" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Price ($)</text><line x1="70" y1="246.88461538461542" x2="734" y2="246.88461538461542" stroke="#e2e6dd"/><text class="af-text" x="62" y="250.88461538461542" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">42</text><line x1="70" y1="214.01748251748253" x2="734" y2="214.01748251748253" stroke="#e2e6dd"/><text class="af-text" x="62" y="218.01748251748253" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">44</text><line x1="70" y1="181.15034965034965" x2="734" y2="181.15034965034965" stroke="#e2e6dd"/><text class="af-text" x="62" y="185.15034965034965" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">46</text><line x1="70" y1="148.28321678321677" x2="734" y2="148.28321678321677" stroke="#e2e6dd"/><text class="af-text" x="62" y="152.28321678321677" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">48</text><line x1="70" y1="115.41608391608389" x2="734" y2="115.41608391608389" stroke="#e2e6dd"/><text class="af-text" x="62" y="119.41608391608389" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">50</text><line x1="70" y1="82.54895104895101" x2="734" y2="82.54895104895101" stroke="#e2e6dd"/><text class="af-text" x="62" y="86.54895104895101" text-anchor="end" style="font-size:13px;f