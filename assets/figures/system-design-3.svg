<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-label="Exposure timing changes a path (separate illustration)"><title>Exposure timing changes a path (separate illustration)</title><desc>Separate fictional illustration, not part of the Atlas-20 scenario. Normalized wealth starts at step 0. The switching path follows the stock through step 3, holds 101 in cash for steps 4–7, and reenters after step 7 at stock index 92; later values equal 101 × (index ÷ 92), rounded to two decimals. Cash earns zero and costs are omitted. The switch dates are given, not produced by a tested filter.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="419" fill="#fffefa"/><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Normalized wealth</text><line x1="76" y1="261.81226935266795" x2="735" y2="261.81226935266795" stroke="#e2e6dd"/><text class="af-text" x="67" y="265.81226935266795" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">90</text><line x1="76" y1="207.3252290192333" x2="735" y2="207.3252290192333" stroke="#e2e6dd"/><text class="af-text" x="67" y="211.3252290192333" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">100</text><line x1="76" y1="152.83818868579866" x2="735" y2="152.83818868579866" stroke="#e2e6dd"/><text class="af-text" x="67" y="156.83818868579866" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">110</text><line x1="76" y1="98.35114835236402" x2="735" y2="98.35114835236402" stroke="#e2e6dd"/><text class="af-text" x="67" y="102.35114835236402" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">120</text><text class="af-text" x="76" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">0</text><text class="af-text" x="135.9090909090909" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">1</tex