<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" role="img" aria-label="One trade and one skip reconcile to cash"><title>One trade and one skip reconcile to cash</title><desc>Fictional connected P1 journal. Skips contribute no account cash flow and are excluded from completed-trade averages.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="225" fill="#fffefa"/><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Event</text><text class="af-text" x="257.33333333333337" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Cash flow ($)</text><text class="af-text" x="502.6666666666667" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Account cash ($)</text><line x1="12" y1="47" x2="748" y2="47" stroke="#e2e6dd"/><text class="af-text" x="12" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Start</text><text class="af-text" x="257.33333333333337" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">0.00</text><text class="af-text" x="502.6666666666667" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">20,000.00</text><line x1="12" y1="86" x2="748" y2="86" stroke="#e2e6dd"/><text class="af-text" x="12" y="104" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">BRDG entry incl. fee</text><text class="af-text" x="257.33333333333337" y="104" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">−2,532.50</text><text class="af-text" x="502.6666666666667" y="104" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">17,467.50</text><line x1="12" y1="125" x2="748" y2="125" stroke="#e2e6dd"/><text class="af-text" x="12" y="143" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">BRDG stop incl. fee</text><text class="af-text" x="257.3333333