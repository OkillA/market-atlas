<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" role="img" aria-label="What changes at each weekly completion"><title>What changes at each weekly completion</title><desc>Each state is sampled after the named daily close, the convention used throughout the chapter.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="298" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. After session 5</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Known completed pair 99→105: up. Later daily retreat can coexist.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. After session 10</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Known completed pair 105→103: down. Session 11 daily rise conflicts.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. After session 15</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Known completed pair 103→110: up. New weekly state begins here.</text></svg>
