le="font-size:12px;font-weight:400;fill:#263831;">105</text><text class="af-text" x="502.6666666666667" y="143" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">405</text><line x1="12" y1="164" x2="748" y2="164" stroke="#e2e6dd"/><text class="af-text" x="12" y="182" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">UTIL</text><text class="af-text" x="257.33333333333337" y="182" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">105</text><text class="af-text" x="502.6666666666667" y="182" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">80</text><line x1="12" y1="203" x2="748" y2="203" stroke="#e2e6dd"/><text class="af-text" x="12" y="221" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Total</text><text class="af-text" x="257.33333333333337" y="221" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">420</text><text class="af-text" x="502.6666666666667" y="221" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">1135</text></svg>
