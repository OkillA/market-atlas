<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-label="A trading range with a spring branch and a breakdown branch"><title>A trading range with a spring branch and a breakdown branch</title><desc>Fictional daily closes. Shaded zones show where the session-1–16 reaction lows ($30.00–$30.40) and highs ($33.60–$34.00) occurred. The frozen rule uses $30.00 support. Session 17 breaches it with a $29.50 low (marked; the close line alone does not show lows). The spring branch closes back above $30.00 at session 18; the breakdown branch never does within sessions 18–20.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="419" fill="#fffefa"/><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Price ($)</text><line x1="76" y1="297" x2="735" y2="297" stroke="#e2e6dd"/><text class="af-text" x="67" y="301" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">28.0</text><line x1="76" y1="234.25000000000003" x2="735" y2="234.25000000000003" stroke="#e2e6dd"/><text class="af-text" x="67" y="238.25000000000003" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">29.6</text><line x1="76" y1="171.49999999999994" x2="735" y2="171.49999999999994" stroke="#e2e6dd"/><text class="af-text" x="67" y="175.49999999999994" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">31.3</text><line x1="76" y1="108.74999999999997" x2="735" y2="108.74999999999997" stroke="#e2e6dd"/><text class="af-text" x="67" y="112.74999999999997" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">33.0</text><line x1="76" y1="46" x2="735" y2="46" stroke="#e2e6dd"/><text class="af-text" x="67" y="50" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">34.6</text><text class="af-text" x="76" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">1</text><text class="af-