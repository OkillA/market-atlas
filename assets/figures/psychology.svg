<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-label="Escalation changes the recovery problem"><title>Escalation changes the recovery problem</title><desc>Fictional account paths in dollars. Both start at $10,000. The fixed-dollar path uses −$100, −$100, −$100, +$200, −$100, +$200, −$100, +$200, −$100, +$200, −$100. The escalated path replaces the first three losses with −$100, −$200 and −$400, then uses the same later dollar changes. After outcome 3, the accounts are $9,700 and $9,300: a $400 difference that persists through outcome 11 ($10,100 versus $9,700). Compare the exposure policy as well as the final equity. No frequencies or predictive claims are implied.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="419" fill="#fffefa"/><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Account equity ($)</text><line x1="76" y1="295.20071684587816" x2="735" y2="295.20071684587816" stroke="#e2e6dd"/><text class="af-text" x="67" y="299.20071684587816" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9200</text><line x1="76" y1="250.21863799283153" x2="735" y2="250.21863799283153" stroke="#e2e6dd"/><text class="af-text" x="67" y="254.21863799283153" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9400</text><line x1="76" y1="205.23655913978496" x2="735" y2="205.23655913978496" stroke="#e2e6dd"/><text class="af-text" x="67" y="209.23655913978496" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9600</text><line x1="76" y1="160.25448028673836" x2="735" y2="160.25448028673836" stroke="#e2e6dd"/><text class="af-text" x="67" y="164.25448028673836" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9800</text><line x1="76" y1="115.27240143369175" x2="735" y2="115.27240143369175" stroke="#e2e6dd"/><text class="af-text" x="67" y="119.27240143369175" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">10000</text><line x1="76" y1="70.29032258064518" x2="735" y2="70.29032258064518" stroke="#e2e6dd"/><text class="af-text" x="67" y="74.29032258064518" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">10200</text><text class="af-text" x="76" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">0</text><text class="af-text" x="135.9090909090909" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">1</text><text class="af-text" x="195.8181818181818" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">2</text><text class="af-text" x="255.72727272727272" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">3</text><text class="af-text" x="315.6363636363636" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">4</text><text class="af-text" x="375.54545454545456" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">5</text><text class="af-text" x="435.45454545454544" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">6</text><text class="af-text" x="495.3636363636364" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">7</text><text class="af-text" x="555.2727272727273" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">8</text><text class="af-text" x="615.1818181818182" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">9</text><text class="af-text" x="675.0909090909091" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">10</text><text class="af-text" x="735" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">11</text><text class="af-text" x="405.5" y="347" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Outcome number, starting at 0</text><path data-series="0" d="M76.00,115.27 L135.91,137.76 L195.82,160.25 L255.73,182.75 L315.64,137.76 L375.55,160.25 L435.45,115.27 L495.36,137.76 L555.27,92.78 L615.18,115.27 L675.09,70.29 L735.00,92.78 " fill="none" stroke="#234d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path data-series="1" d="M76.00,115.27 L135.91,137.76 L195.82,182.75 L255.73,272.71 L315.64,227.73 L375.55,250.22 L435.45,205.24 L495.36,227.73 L555.27,182.75 L615.18,205.24 L675.09,160.25 L735.00,182.75 " fill="none" stroke="#a6523e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4"/><line x1="76" x2="102" y1="369" y2="369" stroke="#234d3d" stroke-width="2.4" /><text class="af-text" x="111" y="373" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Fixed dollar illustration</text><line x1="76" x2="102" y1="393" y2="393" stroke="#a6523e" stroke-width="2.4" stroke-dasharray="8 4"/><text class="af-text" x="111" y="397" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Escalated-loss illustration</text></svg>
