<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-label="Escalation changes the recovery problem"><title>Escalation changes the recovery problem</title><desc>Fictional account paths in dollars. Both start at $10,000. The disciplined path uses −$100, −$100, −$100, +$200, −$100, +$200, −$100, +$200, −$100, +$200, −$100; the escalated path changes loss sizes after early losses. No frequencies or predictive claims are implied. Compare the third-loss annotation: the same early losing direction has a different dollar consequence because the escalated path doubles and then doubles its loss exposure.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="419" fill="#fffefa"/><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Account equity ($)</text><line x1="76" y1="297" x2="735" y2="297" stroke="#e2e6dd"/><text class="af-text" x="67" y="301" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9192</text><line x1="76" y1="234.25" x2="735" y2="234.25" stroke="#e2e6dd"/><text class="af-text" x="67" y="238.25" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9471</text><line x1="76" y1="171.5" x2="735" y2="171.5" stroke="#e2e6dd"/><text class="af-text" x="67" y="175.5" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">9750</text><line x1="76" y1="108.75" x2="735" y2="108.75" stroke="#e2e6dd"/><text class="af-text" x="67" y="112.75" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">10029</text><line x1="76" y1="46" x2="735" y2="46" stroke="#e2e6dd"/><text class="af-text" x="67" y="50" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">10308</text><text class="af-text" x="76" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">0</text><text class="af-text" x="315.6363636363636" y="322" text-anchor="middle" style="font-si