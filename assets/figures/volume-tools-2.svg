<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="The same shares grouped by exact price"><title>The same shares grouped by exact price</title><desc>From the same tape: $9 = 100, $10 = 200, $11 = 300, $12 = 600, $13 = 300, $14 = 100, $15 = 100 shares. Rows sum to 1,700; $12 is the point of control. Bar length represents past share volume, not an open order.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="344" fill="#fffefa"/><text class="af-text" x="74" y="17" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Price ($)</text><text class="af-text" x="64" y="52" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">9.00</text><rect x="74" y="35" width="101.66666666666666" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="182.66666666666666" y="52" text-anchor="start" style="font-size:12px;font-weight:400;">100</text><text class="af-text" x="64" y="89" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">10.00</text><rect x="74" y="72" width="203.33333333333331" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="284.3333333333333" y="89" text-anchor="start" style="font-size:12px;font-weight:400;">200</text><text class="af-text" x="64" y="126" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">11.00</text><rect x="74" y="109" width="305" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="386" y="126" text-anchor="start" style="font-size:12px;font-weight:400;">300</text><text class="af-text" x="64" y="163" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">12.00</text><rect x="74" y="146" width="610" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="691" y="163" text-anchor="start" style="font-size:12px;font-weight:400;">600</text><text class="af-text" x="64" y="200" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">13.00</text><rect x="74" y="183" width="305" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="386" y="200" text-anchor="start" style="font-size:12px;font-weight:400;">300</text><text class="af-text" x="64" y="237" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">14.00</text><rect x="74" y="220" width="101.66666666666666" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="182.66666666666666" y="237" text-anchor="start" style="font-size:12px;font-weight:400;">100</text><text class="af-text" x="64" y="274" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">15.00</text><rect x="74" y="257" width="101.66666666666666" height="23" fill="#234d3d" opacity=".7"/><text class="af-text" x="182.66666666666666" y="274" text-anchor="start" style="font-size:12px;font-weight:400;">100</text><text class="af-text" x="74" y="332" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Volume (shares)</text></svg>
