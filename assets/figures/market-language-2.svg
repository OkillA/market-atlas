<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="From a chart to a reviewable question"><title>From a chart to a reviewable question</title><desc>The output of one stage is an input to the next; a price observation alone does not supply the decisions in later stages.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="398" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Describe</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Instrument, session, interval, prices, activity.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Interpret</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">One hypothesis plus a plausible alternative.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Plan</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Feasible order, quantity, exits, costs, larger-loss scenario.</text><text class="af-text" x="20" y="293" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="325" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Evaluate</text><text class="af-text" x="15" y="354" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Complete outcomes and a comparison, then update the record.</text></svg>
