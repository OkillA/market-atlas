<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="From frozen close to journal row"><title>From frozen close to journal row</title><desc>Fictional BRDG-P1 process. Information enters the decision only at the stated cutoff.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="398" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. S0 close</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Record C50.40 &gt; frozen boundary 50.00, calendar and account. Freeze P1.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. S1 open</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Check offer and availability. Pass: one first-hour limit order. Fail: skip with no retry.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Confirmed fill / expiry</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Freeze filled-share price-risk R; protect that quantity; cancel the remainder at 10:30.</text><text class="af-text" x="20" y="293" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="325" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Exit and review</text><text class="af-text" x="15" y="354" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Apply frozen priority, separate costs, reconcile cash, and grade compliance. Changes become P2.</text></svg>
