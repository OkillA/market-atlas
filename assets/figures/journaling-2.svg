<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="Preserve the record through review"><title>Preserve the record through review</title><desc>Fictional journal process. A proposal creates a version for later evaluation; it does not overwrite the earlier decision.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="398" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Before outcome</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Save version, cutoff, observed data, action or skip reason and original risk contract.</text><text class="af-text" x="20" y="93" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="125" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. During implementation</text><text class="af-text" x="15" y="154" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Append order acknowledgements and filled/canceled quantities; mark simulated versus actual.</text><text class="af-text" x="20" y="193" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="225" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. After exit</text><text class="af-text" x="15" y="254" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Reconcile price P&amp;L, charges, cash and frozen-denominator R; retain ambiguous or missing facts.</text><text class="af-text" x="20" y="293" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="325" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Research review</text><text class="af-text" x="15" y="354" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Count explored groupings, preserve the discovery sample, and freeze a new version for fresh observations.</text></svg>
