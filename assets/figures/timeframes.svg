<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 972" role="img" aria-label="Identical data on linear and log axes"><title>Identical data on linear and log axes</title><desc>The same four fictional values, in the same order, appear in both panels. Each step doubles. The log axis changes vertical spacing, not prices or returns.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="972" fill="#fffefa"/><text class="af-text" x="10" y="27" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Linear: equal dollars occupy equal distance</text><g transform="translate(0 50)"><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Close ($)</text><line x1="76" y1="297" x2="735" y2="297" stroke="#e2e6dd"/><text class="af-text" x="67" y="301" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">2</text><line x1="76" y1="234.25" x2="735" y2="234.25" stroke="#e2e6dd"/><text class="af-text" x="67" y="238.25" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">23</text><line x1="76" y1="171.5" x2="735" y2="171.5" stroke="#e2e6dd"/><text class="af-text" x="67" y="175.5" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">45</text><line x1="76" y1="108.75" x2="735" y2="108.75" stroke="#e2e6dd"/><text class="af-text" x="67" y="112.75" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">67</text><line x1="76" y1="46" x2="735" y2="46" stroke="#e2e6dd"/><text class="af-text" x="67" y="50" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">88</text><text class="af-text" x="76" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">1</text><text class="af-text" x="295.66666666666663" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">2</text><text class="af-text" x="515.3333333333333" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">3</text><text class="af-text" x="735" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">4</text><text class="af-text" x="405.5" y="347" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Equally spaced observation</text><path data-series="0" d="M76.00,272.71 L295.67,243.79 L515.33,185.96 L735.00,70.29 " fill="none" stroke="#234d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="76" x2="102" y1="369" y2="369" stroke="#234d3d" stroke-width="2.4" /><text class="af-text" x="111" y="373" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Harbor close</text></g><text class="af-text" x="12" y="462" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Fictional supplied observations.</text><text class="af-text" x="10" y="507" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Log: equal ratios occupy equal distance</text><g transform="translate(0 530)"><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Close ($)</text><line x1="76" y1="297" x2="735" y2="297" stroke="#e2e6dd"/><text class="af-text" x="67" y="301" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">7.8</text><line x1="76" y1="234.25" x2="735" y2="234.25" stroke="#e2e6dd"/><text class="af-text" x="67" y="238.25" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">15.0</text><line x1="76" y1="171.50000000000003" x2="735" y2="171.50000000000003" stroke="#e2e6dd"/><text class="af-text" x="67" y="175.50000000000003" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">28.7</text><line x1="76" y1="108.75000000000006" x2="735" y2="108.75000000000006" stroke="#e2e6dd"/><text class="af-text" x="67" y="112.75000000000006" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">55.1</text><line x1