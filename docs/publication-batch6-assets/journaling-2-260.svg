<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 569" role="img" aria-label="Preserve the record through review"><title>Preserve the record through review</title><desc>Fictional journal process. A proposal creates a version for later evaluation; it does not overwrite the earlier decision.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="569" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Before outcome</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Save version, cutoff, observed</text><text class="af-text" x="15" y="73" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">data, action or skip reason and</text><text class="af-text" x="15" y="92" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">original risk contract.</text><text class="af-text" x="20" y="131" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="163" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. During implementation</text><text class="af-text" x="15" y="192" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Append order acknowledgements</text><text class="af-text" x="15" y="211" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">and filled/canceled quantities;</text><text class="af-text" x="15" y="230" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">mark simulated versus actual.</text><text class="af-text" x="20" y="269" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="301" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. After exit</text><text class="af-text" x="15" y="330" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Reconcile price P&amp;L, charges, cash</text><text class="af-text" x="15" y="349" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">and frozen-denominator R; retain</text><text class="af-text" x="15" y="368" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">ambiguous or missing facts.</text><text class="af-text" x="20" y="407" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="439" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Research review</text><text class="af-text" x="15" y="468" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Count explored groupings,</text><text class="af-text" x="15" y="487" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">preserve the discovery sample, and</text><text class="af-text" x="15" y="506" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">freeze a new version for fresh</text><text class="af-text" x="15" y="525" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">observations.</text></svg>
