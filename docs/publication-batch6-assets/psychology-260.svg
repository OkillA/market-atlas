<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 407" role="img" aria-label="Escalation changes the recovery problem"><title>Escalation changes the recovery problem</title><desc>Fictional account paths in dollars. Both start at $10,000. The fixed-dollar path uses −$100, −$100, −$100, +$200, −$100, +$200, −$100, +$200, −$100, +$200, −$100. The escalated path replaces the first three losses with −$100, −$200 and −$400, then uses the same later dollar changes. After outcome 3, the accounts are $9,700 and $9,300: a $400 difference that persists through outcome 11 ($10,100 versus $9,700). Compare the exposure policy as well as the final equity. No frequencies or predictive claims are implied.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="407" fill="#fffefa"/><text class="af-text" x="57" y="19" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Account equity ($)</text><line x1="57" y1="247" x2="235" y2="247" stroke="#e2e6dd"/><text class="af-text" x="48" y="251" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">9192</text><line x1="57" y1="196.75" x2="235" y2="196.75" stroke="#e2e6dd"/><text class="af-text" x="48" y="200.75" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">9471</text><line x1="57" y1="146.5" x2="235" y2="146.5" stroke="#e2e6dd"/><text class="af-text" x="48" y="150.5" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">9750</text><line x1="57" y1="96.25" x2="235" y2="96.25" stroke="#e2e6dd"/><text class="af-text" x="48" y="100.25" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">10029</text><line x1="57" y1="46" x2="235" y2="46" stroke="#e2e6dd"/><text class="af-text" x="48" y="50" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">10308</text><text class="af-text" x="57" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">0</text><text class=