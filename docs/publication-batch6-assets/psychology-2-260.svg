<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 877" role="img" aria-label="The note stays frozen as facts arrive"><title>The note stays frozen as facts arrive</title><desc>Fictional BRDG-P1 record. The outcome and the temptation to rewrite it are appended beside the original note, not substituted for it.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="877" fill="#fffefa"/><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 1</text><text class="af-text" x="12" y="46" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cutoff: S1 09:31</text><text class="af-text" x="12" y="72" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">New information: 50 simulated</text><text class="af-text" x="12" y="91" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">shares filled at $50.60</text><text class="af-text" x="12" y="117" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Process / interpretation record:</text><text class="af-text" x="12" y="136" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">P1 gate passed; 1R freezes $100;</text><text class="af-text" x="12" y="155" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">cost $2.50.</text><line x1="12" y1="181" x2="248" y2="181" stroke="#e2e6dd"/><text class="af-text" x="12" y="209" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 2</text><text class="af-text" x="12" y="233" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cutoff: S2 close</text><text class="af-text" x="12" y="259" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">New information: Close $49.60 is</text><text class="af-text" x="12" y="278" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">below $50</text><text class="af-text" x="12" y="304" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Process / interpretation record:</text><text class="af-text" x="12" y="323" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Continuation weakened as</text><text class="af-text" x="12" y="342" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">anticipated; no stop yet. No</text><text class="af-text" x="12" y="361" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">retroactive close-exit rule.</text><line x1="12" y1="387" x2="248" y2="387" stroke="#e2e6dd"/><text class="af-text" x="12" y="415" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 3</text><text class="af-text" x="12" y="439" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cutoff: S3 stop model</text><text class="af-text" x="12" y="465" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">New information: Exit $48.60;</text><text class="af-text" x="12" y="484" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">gross −$100, costs $5, net −$105</text><text class="af-text" x="12" y="510" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Process / interpretation record:</text><text class="af-text" x="12" y="529" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">P1 complied; net −1.05R.</text><text class="af-text" x="12" y="548" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Hypothesis failed on this path;</text><text class="af-text" x="12" y="567" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">no general strategy conclusion.</text><line x1="12" y1="593" x2="248" y2="593" stroke="#e2e6dd"/><text class="af-text" x="12" y="621" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 4</text><text class="af-text" x="12" y="645" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cutoff: Review after S3</text><text class="af-text" x="12" y="671" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">New information: Temptation: “The</text><text class="af-text" x="12" y="690" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">upper shadow made failure</text><text class="af-text" x="12" y="709" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">obvious.”</text><text class="af-text" x="12" y="735" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Process / interpretation record:</text><text class="af-text" x="12" y="754" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Original note allowed failure but</text><text class="af-text" x="12" y="773" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">predicted no probability. Keep</text><text class="af-text" x="12" y="792" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">the note; propose P2 close-exit</text><text class="af-text" x="12" y="811" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">research without changing P1.</text><line x1="12" y1="837" x2="248" y2="837" stroke="#e2e6dd"/></svg>
