<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 554" role="img" aria-label="One trade and one skip reconcile to cash"><title>One trade and one skip reconcile to cash</title><desc>Fictional connected P1 journal. Skips contribute no account cash flow and are excluded from completed-trade averages.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="554" fill="#fffefa"/><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 1</text><text class="af-text" x="12" y="46" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Event: Start</text><text class="af-text" x="12" y="72" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cash flow ($): 0.00</text><text class="af-text" x="12" y="98" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Account cash ($): 20,000.00</text><line x1="12" y1="124" x2="248" y2="124" stroke="#e2e6dd"/><text class="af-text" x="12" y="152" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 2</text><text class="af-text" x="12" y="176" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Event: BRDG entry incl. fee</text><text class="af-text" x="12" y="202" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cash flow ($): −2,532.50</text><text class="af-text" x="12" y="228" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Account cash ($): 17,467.50</text><line x1="12" y1="254" x2="248" y2="254" stroke="#e2e6dd"/><text class="af-text" x="12" y="282" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 3</text><text class="af-text" x="12" y="306" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Event: BRDG stop incl. fee</text><text class="af-text" x="12" y="332" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cash flow ($): +2,427.50</text><text class="af-text" x="12" y="358" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Account cash ($): 19,895.00</text><line x1="12" y1="384" x2="248" y2="384" stroke="#e2e6dd"/><text class="af-text" x="12" y="412" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 4</text><text class="af-text" x="12" y="436" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Event: SKIP: no order</text><text class="af-text" x="12" y="462" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Cash flow ($): 0.00</text><text class="af-text" x="12" y="488" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Account cash ($): 19,895.00</text><line x1="12" y1="514" x2="248" y2="514" stroke="#e2e6dd"/></svg>
