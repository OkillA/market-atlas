<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 1249" role="img" aria-label="Atlas-20 daily processing order"><title>Atlas-20 daily processing order</title><desc>Fixed daily-bar accounting sequence for the fictional scenario. Orders and cash reservations are frozen at the prior close. Batch processing of a close exit before an opening entry is an accounting order only; no later proceeds fund that entry or increase its quantity.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="1249" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Carry in the frozen state</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Rule sheet v1.0, holdings with their</text><text class="af-text" x="15" y="73" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">stops, targets and holding-session</text><text class="af-text" x="15" y="92" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">counts, orders placed at the</text><text class="af-text" x="15" y="111" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">previous close, and reserved cash.</text><text class="af-text" x="20" y="150" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="182" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Process held positions</text><text class="af-text" x="15" y="211" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">No bar: mark stale and keep the</text><text class="af-text" x="15" y="230" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">slot. Otherwise apply the exit</text><text class="af-text" x="15" y="249" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">priority: gap at the open, both</text><text class="af-text" x="15" y="268" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">levels in one bar (stop first),</text><text class="af-text" x="15" y="287" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">stop, target, then the time exit at</text><text class="af-text" x="15" y="306" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">the close.</text><text class="af-text" x="20" y="345" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="377" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Process entry orders</text><text class="af-text" x="15" y="406" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Open at or below the limit fills at</text><text class="af-text" x="15" y="425" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">the open; a trade below the limit</text><text class="af-text" x="15" y="444" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">fills at the limit; a touch or a</text><text class="af-text" x="15" y="463" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">higher low cancels. Cap shares at</text><text class="af-text" x="15" y="482" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">1% of volume and release every</text><text class="af-text" x="15" y="501" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">reservation.</text><text class="af-text" x="20" y="540" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="572" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Mark the close</text><text class="af-text" x="15" y="601" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Equity = cash + shares × close</text><text class="af-text" x="15" y="620" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">(halted: last valid close). Check</text><text class="af-text" x="15" y="639" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">that cash flows reconcile to the</text><text class="af-text" x="15" y="658" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">cent.</text><text class="af-text" x="20" y="697" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="729" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">5. Screen</text><text class="af-text" x="15" y="758" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Skip held stocks. Then check the</text><text class="af-text" x="15" y="777" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">complete 21-bar record, the</text><text class="af-text" x="15" y="796" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">signal, the price band, liquidity, and</text><text class="af-text" x="15" y="815" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">the earnings window, recording the</text><text class="af-text" x="15" y="834" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">first failure.</text><text class="af-text" x="20" y="873" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="905" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">6. Rank, size, reserve</text><text class="af-text" x="15" y="934" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Sort by breakout margin, then</text><text class="af-text" x="15" y="953" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">name. Free slots = 5 − open</text><text class="af-text" x="15" y="972" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">positions. Shares = the smallest of</text><text class="af-text" x="15" y="991" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">the risk, notional, and cash</text><text class="af-text" x="15" y="1010" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">allowances; reserve shares × limit +</text><text class="af-text" x="15" y="1029" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">$2.50.</text><text class="af-text" x="20" y="1068" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="1100" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">7. Log and review</text><text class="af-text" x="15" y="1129" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Record orders, rejections, skips,</text><text class="af-text" x="15" y="1148" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">and any review trigger before the</text><text class="af-text" x="15" y="1167" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">next open. A trigger starts a</text><text class="af-text" x="15" y="1186" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">review; it does not change the</text><text class="af-text" x="15" y="1205" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">rules.</text></svg>
