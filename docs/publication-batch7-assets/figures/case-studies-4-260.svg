<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 1163" role="img" aria-label="GME: sparse documented observations, with cutoffs preserved"><title>GME: sparse documented observations, with cutoffs preserved</title><desc>SEC staff report (2021), section 3.2, pp. 18–19. Original table of reported facts and explicitly derived closes; omitted sessions are not interpolated. The intraday high is separate from the closes.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="1163" fill="#fffefa"/><text class="af-text" x="10" y="27" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Two-session reaction known at</text><text class="af-text" x="10" y="46" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">January 13 close</text><g transform="translate(0 70)"><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 1</text><text class="af-text" x="12" y="46" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">U.S. session: 2021-01-12</text><text class="af-text" x="12" y="72" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Close ($/share): 19.95</text><text class="af-text" x="12" y="98" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Share volume (approx.): 7 million</text><line x1="12" y1="124" x2="248" y2="124" stroke="#e2e6dd"/><text class="af-text" x="12" y="152" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 2</text><text class="af-text" x="12" y="176" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">U.S. session: 2021-01-13</text><text class="af-text" x="12" y="202" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Close ($/share): 31.4</text><text class="af-text" x="12" y="228" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Share volume (approx.): 144</text><text class="af-text" x="12" y="247" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">million</text><line x1="12" y1="273" x2="248" y2="273" stroke="#e2e6dd"/></g><text class="af-text" x="10" y="423" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Three consecutive closes, read</text><text class="af-text" x="10" y="442" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">in chronological order</text><g transform="translate(0 466)"><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 1</text><text class="af-text" x="12" y="46" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">U.S. session: 2021-01-26</text><text class="af-text" x="12" y="72" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Close ($/share): 147.98</text><text class="af-text" x="12" y="98" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Provenance: 347.51 − 199.53</text><text class="af-text" x="12" y="117" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">(derived)</text><line x1="12" y1="143" x2="248" y2="143" stroke="#e2e6dd"/><text class="af-text" x="12" y="171" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 2</text><text class="af-text" x="12" y="195" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">U.S. session: 2021-01-27</text><text class="af-text" x="12" y="221" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Close ($/share): 347.51</text><text class="af-text" x="12" y="247" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Provenance: Reported close</text><line x1="12" y1="273" x2="248" y2="273" stroke="#e2e6dd"/><text class="af-text" x="12" y="301" text-anchor="start" style="font-size:13px;font-weight:500;fill:#234d3d;">Record 3</text><text class="af-text" x="12" y="325" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">U.S. session: 2021-01-28</text><text class="af-text" x="12" y="351" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Close ($/share): 193.6</text><text class="af-text" x="12" y="377" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Provenance: 347.51 − 153.91</text><text class="af-text" x="12" y="396" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">(derived)</text><line x1="12" y1="422" x2="248" y2="422" stroke="#e2e6dd"/></g><text class="af-text" x="10" y="968" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Different observation type: not</text><text class="af-text" x="10" y="987" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">a closing fill</text><g transform="translate(0 1011)"><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">U.S. session</text><text class="af-text" x="130" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Intraday high</text><text class="af-text" x="130" y="41" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">($/share)</text><line x1="12" y1="66" x2="248" y2="66" stroke="#e2e6dd"/><text class="af-text" x="12" y="84" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">2021-01-28</text><text class="af-text" x="130" y="84" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">483</text></g></svg>
