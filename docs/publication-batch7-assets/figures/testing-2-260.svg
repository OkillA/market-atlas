<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 1149" role="img" aria-label="A research timeline: what each stage may see"><title>A research timeline: what each stage may see</title><desc>Maya’s fictional study in chronological order. Each step lists the information it may use. Information from a later step must not flow back into an earlier one; any change after step 4 starts a new version.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="1149" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Freeze the question (before</text><text class="af-text" x="15" y="44" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">any results)</text><text class="af-text" x="15" y="73" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Write rule v1, data and universe</text><text class="af-text" x="15" y="92" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">definitions, cost models A–C, the</text><text class="af-text" x="15" y="111" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">six-variant list, the lock rule, the</text><text class="af-text" x="15" y="130" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">window dates, and the decision</text><text class="af-text" x="15" y="149" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">criteria. Allowed: definitions and</text><text class="af-text" x="15" y="168" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">data-quality checks. Not allowed:</text><text class="af-text" x="15" y="187" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">any performance figure.</text><text class="af-text" x="20" y="226" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="258" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Development window (earlier</text><text class="af-text" x="15" y="277" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">dates only)</text><text class="af-text" x="15" y="306" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Run the six listed variants and log</text><text class="af-text" x="15" y="325" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">every result, including weak ones.</text><text class="af-text" x="15" y="344" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Allowed: development-window data.</text><text class="af-text" x="15" y="363" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Not allowed: charts or results from</text><text class="af-text" x="15" y="382" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">evaluation dates.</text><text class="af-text" x="20" y="421" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="453" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Lock</text><text class="af-text" x="15" y="482" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Apply the declared lock rule (v1-b</text><text class="af-text" x="15" y="501" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">is chosen), save code, data</text><text class="af-text" x="15" y="520" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">snapshot, and the variant count.</text><text class="af-text" x="15" y="539" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">The rule cannot change for this</text><text class="af-text" x="15" y="558" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">evaluation.</text><text class="af-text" x="20" y="597" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="629" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Held-out or walk-forward</text><text class="af-text" x="15" y="648" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">evaluation</text><text class="af-text" x="15" y="677" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Run the locked rule once on later</text><text class="af-text" x="15" y="696" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">dates and report every cost model.</text><text class="af-text" x="15" y="715" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Walk-forward repeats steps 2–4,</text><text class="af-text" x="15" y="734" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">each time using only data before</text><text class="af-text" x="15" y="753" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">the next window. Not allowed:</text><text class="af-text" x="15" y="772" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">retuning after seeing the result.</text><text class="af-text" x="20" y="811" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="843" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">5. Paper forward study</text><text class="af-text" x="15" y="872" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Apply the locked rule to new</text><text class="af-text" x="15" y="891" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">sessions as they arrive. Timestamp</text><text class="af-text" x="15" y="910" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">each decision before its outcome</text><text class="af-text" x="15" y="929" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">and label every fill as simulated.</text><text class="af-text" x="20" y="968" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="1000" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">6. Review and version</text><text class="af-text" x="15" y="1029" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Compare results with the step-1</text><text class="af-text" x="15" y="1048" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">criteria. Any change becomes v2;</text><text class="af-text" x="15" y="1067" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">the old held-out window is now</text><text class="af-text" x="15" y="1086" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">development data for v2, which</text><text class="af-text" x="15" y="1105" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">needs fresh evaluation data.</text></svg>
