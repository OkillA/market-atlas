<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 369" role="img" aria-label="A trading range with a spring branch and a breakdown branch"><title>A trading range with a spring branch and a breakdown branch</title><desc>Fictional daily closes. Shaded zones show where the session-1–16 reaction lows ($30.00–$30.40) and highs ($33.60–$34.00) occurred. The frozen rule uses $30.00 support. Session 17 breaches it with a $29.50 low (marked). The close line does not show highs or lows, so the session-1–16 reaction extremes behind the zones are listed in the chapter’s table. The spring branch closes back above $30.00 at session 18; the breakdown branch never does within sessions 18–20 and closes at $28.60 at session 20.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="369" fill="#fffefa"/><text class="af-text" x="57" y="19" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Price ($)</text><line x1="57" y1="247" x2="235" y2="247" stroke="#e2e6dd"/><text class="af-text" x="48" y="251" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">28.0</text><line x1="57" y1="196.75000000000003" x2="235" y2="196.75000000000003" stroke="#e2e6dd"/><text class="af-text" x="48" y="200.75000000000003" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">29.6</text><line x1="57" y1="146.49999999999994" x2="235" y2="146.49999999999994" stroke="#e2e6dd"/><text class="af-text" x="48" y="150.49999999999994" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">31.3</text><line x1="57" y1="96.24999999999997" x2="235" y2="96.24999999999997" stroke="#e2e6dd"/><text class="af-text" x="48" y="100.24999999999997" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">33.0</text><line x1="57" y1="46" x2="235" y2="46" stroke="#e2e6dd"/><text class="af-text" x="48" y="50" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">34.6</text><text class="af-text" x="57" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">1</text><text class="af-text" x="150.68421052631578" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">11</text><text class="af-text" x="235" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">20</text><text class="af-text" x="146" y="297" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Fictional session</text><rect x="57" y="65.45161290322591" width="178" height="12.007168458781308" fill="#234d3d" opacity=".10"/><text class="af-text" x="62" y="80.45161290322591" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Resistance zone</text><rect x="57" y="173.51612903225816" width="178" height="12.007168458781337" fill="#234d3d" opacity=".10"/><text class="af-text" x="62" y="188.51612903225816" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Support zone</text><path data-series="0" d="M57.00,137.49 L66.37,80.46 L75.74,113.48 L85.11,167.51 L94.47,140.50 L103.84,101.47 L113.21,83.46 L122.58,125.49 L131.95,164.51 L141.32,137.49 L150.68,98.47 L160.05,89.47 L169.42,122.49 L178.79,158.51 L188.16,131.49 L197.53,155.51 L206.89,191.53 L216.26,167.51 L225.63,155.51 L235.00,143.50 " fill="none" stroke="#234d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path data-series="1" d="M206.89,191.53 L216.26,203.53 L225.63,212.54 L235.00,227.55 " fill="none" stroke="#a6523e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4"/><line x1="206.89473684210526" y1="200.53225806451618" x2="155.89473684210526" y2="224.53225806451618" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="29.5" cx="206.89473684210526" cy="200.53225806451618" r="3.5" fill="#fffefa" stroke="#234d3d" stroke-width="1.7"><title>Session 17 low $29.50, a 1.67% breach</title></circle><rect x="110.89473684210526" y="213.53225806451618" width="90" height="21" fill="#fffefa" opacity=".92"/><text class="af-text" x="114.89473684210526" y="227.53225806451618" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">17: low 29.50</text><line x1="216.26315789473685" y1="167.5125448028674" x2="167" y2="185" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="30.6" cx="216.26315789473685" cy="167.5125448028674" r="3.5" fill="#fffefa" stroke="#234d3d" stroke-width="1.7"><title>Session 18 close $30.60: reentry</title></circle><rect x="134" y="174" width="66" height="21" fill="#fffefa" opacity=".92"/><text class="af-text" x="138" y="188" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">18: 30.60</text><line x1="57" x2="83" y1="319" y2="319" stroke="#234d3d" stroke-width="2.4" /><text class="af-text" x="92" y="323" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Spring branch close</text><line x1="57" x2="83" y1="343" y2="343" stroke="#a6523e" stroke-width="2.4" stroke-dasharray="8 4"/><text class="af-text" x="92" y="347" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Breakdown branch close</text></svg>
