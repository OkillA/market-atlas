<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 642" role="img" aria-label="GME: sparse documented observations, with cutoffs preserved"><title>GME: sparse documented observations, with cutoffs preserved</title><desc>SEC staff report (2021), section 3.2, pp. 18–19. Original table of reported facts and explicitly derived closes; omitted sessions are not interpolated. The intraday high is separate from the closes.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="642" fill="#fffefa"/><text class="af-text" x="10" y="27" text-anchor="start" style="font-size:14px;font-weight:500;fill:#263831;">Two-session reaction known at January 13 close</text><g transform="translate(0 50)"><text class="af-text" x="12" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">U.S. session</text><text class="af-text" x="257.33333333333337" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Close ($/share)</text><text class="af-text" x="502.6666666666667" y="22" text-anchor="start" style="font-size:12px;font-weight:500;fill:#234d3d;">Share volume (approx.)</text><line x1="12" y1="47" x2="748" y2="47" stroke="#e2e6dd"/><text class="af-text" x="12" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">2021-01-12</text><text class="af-text" x="257.33333333333337" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">19.95</text><text class="af-text" x="502.6666666666667" y="65" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">7 million</text><line x1="12" y1="86" x2="748" y2="86" stroke="#e2e6dd"/><text class="af-text" x="12" y="104" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">2021-01-13</text><text class="af-text" x="257.33333333333337" y="104" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">31.4</text><text class="af-text" x="502.6666666666667" y="104" te