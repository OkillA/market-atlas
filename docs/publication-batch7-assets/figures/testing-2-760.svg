<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 731" role="img" aria-label="A research timeline: what each stage may see"><title>A research timeline: what each stage may see</title><desc>Maya’s fictional study in chronological order. Each step lists the information it may use. Information from a later step must not flow back into an earlier one; any change after step 4 starts a new version.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="731" fill="#fffefa"/><text class="af-text" x="15" y="25" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">1. Freeze the question (before any results)</text><text class="af-text" x="15" y="54" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Write rule v1, data and universe definitions, cost models A–C, the six-variant list, the lock rule, the window</text><text class="af-text" x="15" y="73" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">dates, and the decision criteria. Allowed: definitions and data-quality checks. Not allowed: any performance</text><text class="af-text" x="15" y="92" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">figure.</text><text class="af-text" x="20" y="131" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="163" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">2. Development window (earlier dates only)</text><text class="af-text" x="15" y="192" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Run the six listed variants and log every result, including weak ones. Allowed: development-window data. Not</text><text class="af-text" x="15" y="211" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">allowed: charts or results from evaluation dates.</text><text class="af-text" x="20" y="250" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="282" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">3. Lock</text><text class="af-text" x="15" y="311" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Apply the declared lock rule (v1-b is chosen), save code, data snapshot, and the variant count. The rule cannot</text><text class="af-text" x="15" y="330" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">change for this evaluation.</text><text class="af-text" x="20" y="369" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="401" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">4. Held-out or walk-forward evaluation</text><text class="af-text" x="15" y="430" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Run the locked rule once on later dates and report every cost model. Walk-forward repeats steps 2–4, each</text><text class="af-text" x="15" y="449" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">time using only data before the next window. Not allowed: retuning after seeing the result.</text><text class="af-text" x="20" y="488" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="520" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">5. Paper forward study</text><text class="af-text" x="15" y="549" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Apply the locked rule to new sessions as they arrive. Timestamp each decision before its outcome and label every</text><text class="af-text" x="15" y="568" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">fill as simulated.</text><text class="af-text" x="20" y="607" text-anchor="start" style="font-size:20px;font-weight:400;fill:#586057;">↓</text><text class="af-text" x="15" y="639" text-anchor="start" style="font-size:14px;font-weight:500;fill:#234d3d;">6. Review and version</text><text class="af-text" x="15" y="668" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">Compare results with the step-1 criteria. Any change becomes v2; the old held-out window is now development</text><text class="af-text" x="15" y="687" text-anchor="start" style="font-size:13px;font-weight:400;fill:#263831;">data for v2, which needs fresh evaluation data.</text></svg>
