<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 450" role="img" aria-label="A close-based signal and the first feasible fill"><title>A close-based signal and the first feasible fill</title><desc>Fictional OHLC from the look-ahead table. The day-S close of $50.40 is above the $50.00 prior-20 high, but it is known only at the close; the first feasible fill is the S+1 open of $50.70. Buying at the $49.80 S open would use information that did not yet exist.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="450" fill="#fffefa"/><text class="af-text" x="52" y="18" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Price ($)</text><line x1="52" y1="274" x2="234" y2="274" stroke="#e2e6dd"/><text class="af-text" x="44" y="278" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">49.39</text><line x1="52" y1="215.25" x2="234" y2="215.25" stroke="#e2e6dd"/><text class="af-text" x="44" y="219.25" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">50.07</text><line x1="52" y1="156.5" x2="234" y2="156.5" stroke="#e2e6dd"/><text class="af-text" x="44" y="160.5" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">50.75</text><line x1="52" y1="97.75" x2="234" y2="97.75" stroke="#e2e6dd"/><text class="af-text" x="44" y="101.75" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">51.43</text><line x1="52" y1="39" x2="234" y2="39" stroke="#e2e6dd"/><text class="af-text" x="44" y="43" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">52.11</text><line x1="82.33333333333333" y1="143.58791208791217" x2="82.33333333333333" y2="246.88461538461547" stroke="#234d3d" stroke-width="1.8"/><rect x="69.59333333333333" y="186.62820512820537" width="25.479999999999997" height="51.64835164835196" fill="#234d3d"/><title>S: signal: O 49.8, H 50.9, L 49.7, C 50.4</title><text class="af-text" x="82.33333333333333" y="298" text-anch