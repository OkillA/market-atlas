<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 364" role="img" aria-label="An idealized wave template"><title>An idealized wave template</title><desc>Invented Elliott-style schematic; the initial state is step 0. Labels 1–5 and A–C mark the swing endpoints of count A: wave 2 ends at 42, above the 40 start; wave 4 ends at 47, above the wave-1 high of 44; impulse lengths are 4, 8, and 6, so wave 3 is not the shortest. Intermediate points are straight-line fillers, not lower-degree waves. The rule-check table shows that a different count of the same swings also passes.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="364" fill="#fffefa"/><text class="af-text" x="57" y="19" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Fictional price ($)</text><line x1="57" y1="247" x2="235" y2="247" stroke="#e2e6dd"/><text class="af-text" x="48" y="251" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">38.4</text><line x1="57" y1="196.75" x2="235" y2="196.75" stroke="#e2e6dd"/><text class="af-text" x="48" y="200.75" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">42.5</text><line x1="57" y1="146.5" x2="235" y2="146.5" stroke="#e2e6dd"/><text class="af-text" x="48" y="150.5" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">46.5</text><line x1="57" y1="96.25" x2="235" y2="96.25" stroke="#e2e6dd"/><text class="af-text" x="48" y="100.25" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">50.5</text><line x1="57" y1="46" x2="235" y2="46" stroke="#e2e6dd"/><text class="af-text" x="48" y="50" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">54.6</text><text class="af-text" x="57" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">0</text><text class="af-text" x="146" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">8</text><text class="af-text" x="235" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">16</text><text class="af-text" x="146" y="297" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Schematic step, starting at</text><text class="af-text" x="146" y="316" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">0</text><path data-series="0" d="M57.00,227.55 L68.13,202.61 L79.25,177.67 L90.38,190.14 L101.50,202.61 L112.63,152.73 L123.75,102.86 L134.88,121.56 L146.00,140.27 L157.13,102.86 L168.25,65.45 L179.38,90.39 L190.50,115.33 L201.63,102.86 L212.75,90.39 L223.88,121.56 L235.00,152.73 " fill="none" stroke="#234d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="79.25" y1="177.67245657568236" x2="94.25" y2="160.67245657568236" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="44" cx="79.25" cy="177.67245657568236" r="3.5" fill="#fffefa" stroke="#234d3d" stroke-width="1.7"><title>1</title></circle><rect x="85.25" y="149.67245657568236" width="18" height="21" fill="#fffefa" opacity=".92"/><text class="af-text" x="89.25" y="163.67245657568236" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">1</text><line x1="101.5" y1="202.61042183622828" x2="116.5" y2="226.61042183622828" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="42" cx="101.5" cy="202.61042183622828" r="3.5" fill="#fffefa" stroke="#234d3d" stroke-width="1.7"><title>2</title></circle><rect x="107.5" y="215.61042183622828" width="18" height="21" fill="#fffefa" opacity=".92"/><text class="af-text" x="111.5" y="229.61042183622828" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">2</text><line x1="123.75" y1="102.85856079404468" x2="138.75" y2="85.85856079404468" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="0" data-value="50" cx="123.75" cy="102.85856079404468" r="3.5" fill="#fffefa" stroke="#234d3