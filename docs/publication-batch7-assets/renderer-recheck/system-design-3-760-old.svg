<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-label="Exposure timing changes a path (separate illustration)"><title>Exposure timing changes a path (separate illustration)</title><desc>Separate fictional illustration, not part of the Atlas-20 scenario. Normalized wealth starts at step 0. The switching path follows the stock through step 3, holds 101 in cash for steps 4–7, and reenters after step 7 at stock index 92; later values equal 101 × (index ÷ 92), rounded to two decimals. Cash earns zero and costs are omitted. The switch dates are given, not produced by a tested filter.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="760" height="419" fill="#fffefa"/><text class="af-text" x="76" y="19" text-anchor="start" style="font-size:13px;font-weight:400;fill:#586057;">Normalized wealth</text><line x1="76" y1="297" x2="735" y2="297" stroke="#e2e6dd"/><text class="af-text" x="67" y="301" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">84</text><line x1="76" y1="234.24999999999994" x2="735" y2="234.24999999999994" stroke="#e2e6dd"/><text class="af-text" x="67" y="238.24999999999994" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">95</text><line x1="76" y1="171.5" x2="735" y2="171.5" stroke="#e2e6dd"/><text class="af-text" x="67" y="175.5" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">107</text><line x1="76" y1="108.75000000000003" x2="735" y2="108.75000000000003" stroke="#e2e6dd"/><text class="af-text" x="67" y="112.75000000000003" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">118</text><line x1="76" y1="46" x2="735" y2="46" stroke="#e2e6dd"/><text class="af-text" x="67" y="50" text-anchor="end" style="font-size:13px;font-weight:400;fill:#586057;">130</text><text class="af-text" x="76" y="322" text-anchor="middle" style="font-size:13px;font-weight:400;fill:#586057;">0</text><text class="af-text" x="315.636363636