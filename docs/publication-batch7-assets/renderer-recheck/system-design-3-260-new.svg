<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 388" role="img" aria-label="Exposure timing changes a path (separate illustration)"><title>Exposure timing changes a path (separate illustration)</title><desc>Separate fictional illustration, not part of the Atlas-20 scenario. Normalized wealth starts at step 0. The switching path follows the stock through step 3, holds 101 in cash for steps 4–7, and reenters after step 7 at stock index 92; later values equal 101 × (index ÷ 92), rounded to two decimals. Cash earns zero and costs are omitted. The switch dates are given, not produced by a tested filter.</desc><style>.af-text{font-family:Arial,sans-serif;fill:#263831}</style><rect width="260" height="388" fill="#fffefa"/><text class="af-text" x="57" y="19" text-anchor="start" style="font-size:12px;font-weight:400;fill:#586057;">Normalized wealth</text><line x1="57" y1="247" x2="235" y2="247" stroke="#e2e6dd"/><text class="af-text" x="48" y="251" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">84</text><line x1="57" y1="196.74999999999997" x2="235" y2="196.74999999999997" stroke="#e2e6dd"/><text class="af-text" x="48" y="200.74999999999997" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">95</text><line x1="57" y1="146.5" x2="235" y2="146.5" stroke="#e2e6dd"/><text class="af-text" x="48" y="150.5" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">107</text><line x1="57" y1="96.25000000000003" x2="235" y2="96.25000000000003" stroke="#e2e6dd"/><text class="af-text" x="48" y="100.25000000000003" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">118</text><line x1="57" y1="46" x2="235" y2="46" stroke="#e2e6dd"/><text class="af-text" x="48" y="50" text-anchor="end" style="font-size:12px;font-weight:400;fill:#586057;">130</text><text class="af-text" x="57" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">0</text><text class="af-text" x="154.09090909090907" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">6</text><text class="af-text" x="235" y="272" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">11</text><text class="af-text" x="146" y="297" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">Illustrative step, starting</text><text class="af-text" x="146" y="316" text-anchor="middle" style="font-size:12px;font-weight:400;fill:#586057;">at 0</text><path data-series="0" d="M57.00,175.19 L73.18,166.46 L89.36,157.74 L105.55,170.83 L121.73,192.64 L137.91,218.82 L154.09,227.55 L170.27,210.10 L186.45,183.92 L202.64,153.37 L218.82,131.56 L235.00,114.10 " fill="none" stroke="#234d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path data-series="1" d="M57.00,175.19 L73.18,166.46 L89.36,157.74 L105.55,170.83 L121.73,170.83 L137.91,170.83 L154.09,170.83 L170.27,170.83 L186.45,142.07 L202.64,108.56 L218.82,84.61 L235.00,65.45 " fill="none" stroke="#a6523e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4"/><line x1="105.54545454545453" y1="170.82542439109105" x2="106" y2="134" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="1" data-value="101" cx="105.54545454545453" cy="170.82542439109105" r="3.5" fill="#fffefa" stroke="#a6523e" stroke-width="1.7"><title>Switch to cash after step 3</title></circle><rect x="58" y="114" width="96" height="39" fill="#fffefa" opacity=".92"/><text class="af-text" x="62" y="128" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Switch to cash</text><text class="af-text" x="62" y="147" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">after step 3</text><line x1="170.27272727272725" y1="170.82542439109105" x2="131" y2="94" stroke="#586057" stroke-width=".7"/><circle data-annotation-series="1" data-value="101" cx="170.27272727272725" cy="170.82542439109105" r="3.5" fill="#fffefa" stroke="#a6523e" stroke-width="1.7"><title>Reenter after step 7</title></circle><rect x="86" y="74" width="90" height="39" fill="#fffefa" opacity=".92"/><text class="af-text" x="90" y="88" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Reenter after</text><text class="af-text" x="90" y="107" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">step 7</text><line x1="57" x2="83" y1="338" y2="338" stroke="#234d3d" stroke-width="2.4" /><text class="af-text" x="92" y="342" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Always invested</text><line x1="57" x2="83" y1="362" y2="362" stroke="#a6523e" stroke-width="2.4" stroke-dasharray="8 4"/><text class="af-text" x="92" y="366" text-anchor="start" style="font-size:12px;font-weight:400;fill:#263831;">Illustrative switching</text></svg>